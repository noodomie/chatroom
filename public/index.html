<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatRoom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            direction: ltr;
        }
        body {
            background-color: #050505;
            color: #fff;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
            position: relative;
            background: #000;
        }
        /* Masaüstü ve Tablet Görünüm Optimizasyonu */
        @media (min-width: 769px) {
            .container {
                height: 92dvh;
                max-height: 800px;
                border: 1px solid #333;
                border-radius: 8px;
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            }
        }
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow: hidden;
            height: 100%;
            position: relative;
        }
        .hidden {
            display: none !important;
        }
        #login-screen {
            justify-content: center;
            align-items: center;
            gap: 16px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        .title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            outline: none;
            font-size: 16px;
            text-align: left;
            direction: ltr;
            user-select: text;
            -webkit-user-select: text;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #000;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .btn:active {
            background: #aaa;
        }
        .error {
            color: #ff3333;
            font-size: 14px;
            min-height: 18px;
            text-align: center;
        }
        .chat-header {
            padding: 14px;
            border-bottom: 1px solid #fff;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        .online-badge {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .online-badge .dot, #online-count {
            color: #22c55e;
        }
        .edge-handle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 48px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px 0 0 2px;
            z-index: 5;
            cursor: pointer;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 10px 22px 10px;
            border: 1px solid #333;
            word-break: break-word;
            text-align: left;
            direction: ltr;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }
        .device-icon {
            font-size: 13px;
            margin-right: 4px;
            display: inline-block;
            vertical-align: middle;
        }
        .message a {
            color: #3b82f6;
            text-decoration: underline;
            word-break: break-all;
        }
        .msg-time {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 10px;
            color: #666;
        }
        .system-msg {
            font-size: 12px;
            padding: 4px 0;
            text-align: center;
            background: transparent;
            border: none;
            font-weight: bold;
            letter-spacing: 0.5px;
            white-space: pre-line;
        }
        .system-msg.join {
            color: #22c55e;
        }
        .system-msg.leave {
            color: #ef4444;
        }
        .system-msg.info {
            color: #3b82f6;
        }
        .input-area-wrapper {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #fff;
            flex-shrink: 0;
            width: 100%;
            padding-top: 8px;
        }
        .input-area {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .input-area input {
            flex: 1;
            width: 0;
        }
        .input-area .send-btn {
            width: auto;
            padding: 14px 20px;
            white-space: nowrap;
        }
        .drawer-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10;
        }
        .drawer {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            height: 100%;
            background: #000;
            border-left: 1px solid #fff;
            z-index: 20;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        .drawer.open {
            transform: translateX(0);
        }
        @keyframes peekAnimation {
            0% { transform: translateX(100%); }
            40% { transform: translateX(calc(100% - 35px)); }
            70% { transform: translateX(calc(100% - 35px)); }
            100% { transform: translateX(100%); }
        }
        .drawer.peek {
            animation: peekAnimation 0.8s ease-in-out;
        }
        .drawer-header {
            padding: 14px;
            border-bottom: 1px solid #fff;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .drawer-close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 2px 6px;
            line-height: 1;
        }
        .drawer-close-btn:active {
            color: #888;
        }
        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .user-item {
            padding: 10px;
            border: 1px solid #222;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-item:active {
            border-color: #fff;
        }
        .user-info-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-tag {
            font-size: 10px;
            color: #666;
            border: 1px solid #333;
            padding: 2px 4px;
        }
        .drawer-footer {
            padding: 12px;
            border-top: 1px solid #222;
            font-size: 11px;
            color: #666;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="screen">
        <div class="title">CHAT</div>
        <input type="text" id="username" placeholder="Enter username..." maxlength="16" autocomplete="off" spellcheck="false">
        <div id="error" class="error"></div>
        <button class="btn" id="join-btn">JOIN</button>
    </div>

    <div id="chat-screen" class="screen hidden">
        <div class="chat-header">
            <span>CHAT ROOM</span>
            <div class="online-badge">ONLINE <span class="dot">●</span> <span id="online-count">0</span></div>
        </div>
        <div id="edge-handle" class="edge-handle"></div>
        <div id="messages"></div>

        <div class="input-area-wrapper">
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." maxlength="500" autocomplete="off" spellcheck="false">
                <button class="btn send-btn" id="send-btn">SEND</button>
            </div>
        </div>
    </div>

    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-header">
            <span>USERS</span>
            <button id="close-drawer-btn" class="drawer-close-btn">✕</button>
        </div>
        <div id="user-list" class="user-list"></div>
        <div class="drawer-footer" id="ping-info">PING: --ms</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myUsername = '';
    let myDeviceType = '';
    let lastSendTime = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    // Cihaz Türü Tespiti (Telefon, Tablet, Bilgisayar)
    function detectDeviceType() {
        const ua = navigator.userAgent;
        if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) {
            return 'tablet';
        }
        if (/Mobile|iP(hone|od)|Android|BlackBerry|IEMobile|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/i.test(ua)) {
            return 'mobile';
        }
        return 'desktop';
    }

    function getDeviceIcon(device) {
        if (device === 'mobile') return '📱';
        if (device === 'tablet') return '📟';
        return '💻';
    }

    // ==========================================
    // SES MOTORU (Web Audio API)
    // ==========================================
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playMessageSound() {
        try {
            initAudio();
            const now = audioCtx.currentTime;

            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(523.25, now);
            gain1.gain.setValueAtTime(0.08, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(783.99, now + 0.07);
            gain2.gain.setValueAtTime(0.08, now + 0.07);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.07);
            osc2.stop(now + 0.18);
        } catch (e) {}
    }

    function playClickSound() {
        try {
            initAudio();
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.03);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.03);
        } catch (e) {}
    }

    function triggerVibration() {
        if (navigator.vibrate) {
            navigator.vibrate(25);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    function formatMessageText(text) {
        const escaped = escapeHtml(text);
        const urlRegex = new RegExp('(https?:\\/\\/[^\\s]+)', 'g');
        return escaped.replace(urlRegex, function(url) {
            return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
        });
    }

    function getClientTimestamp() {
        const d = new Date();
        const hrs = String(d.getHours()).padStart(2, '0');
        const mins = String(d.getMinutes()).padStart(2, '0');
        return hrs + ':' + mins;
    }

    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username');
    const joinBtn = document.getElementById('join-btn');
    const errorDiv = document.getElementById('error');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const drawer = document.getElementById('drawer');
    const drawerBackdrop = document.getElementById('drawer-backdrop');
    const onlineCount = document.getElementById('online-count');
    const closeDrawerBtn = document.getElementById('close-drawer-btn');
    const userListDiv = document.getElementById('user-list');
    const pingInfo = document.getElementById('ping-info');
    const edgeHandle = document.getElementById('edge-handle');

    function openDrawer() {
        drawer.classList.remove('peek');
        drawer.classList.add('open');
        drawerBackdrop.classList.remove('hidden');
    }

    function closeDrawer() {
        drawer.classList.remove('open');
        drawerBackdrop.classList.add('hidden');
    }

    edgeHandle.onclick = () => {
        playClickSound();
        triggerVibration();
        openDrawer();
    };

    closeDrawerBtn.onclick = () => {
        playClickSound();
        triggerVibration();
        closeDrawer();
    };

    drawerBackdrop.onclick = () => {
        closeDrawer();
    };

    document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    }, false);

    function handleSwipe() {
        const diff = touchEndX - touchStartX;
        if (diff < -60) {
            openDrawer();
        } else if (diff > 60) {
            closeDrawer();
        }
    }

    function joinChat() {
        playClickSound();
        triggerVibration();
        const name = usernameInput.value.trim();
        const regex = /^[a-zA-Z]{3,16}$/;

        if (!regex.test(name)) {
            errorDiv.innerText = 'Invalid Name';
            return;
        }

        myDeviceType = detectDeviceType();

        socket.emit('join', { name: name, device: myDeviceType }, (res) => {
            if (res.success) {
                myUsername = name;
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                msgInput.focus();

                setTimeout(() => {
                    drawer.classList.add('peek');
                }, 500);

                startPingLoop();
            } else {
                errorDiv.innerText = res.error;
            }
        });
    }

    joinBtn.onclick = joinChat;
    usernameInput.onkeydown = (e) => {
        if (e.key === 'Enter') joinChat();
    };

    function renderMessage(data) {
        const div = document.createElement('div');

        if (data.type === 'system') {
            div.className = 'system-msg ' + data.event;
            div.innerText = data.text;
        } else {
            div.className = 'message';
            const devIcon = getDeviceIcon(data.device || 'desktop');
            const iconHtml = '<span class="device-icon">' + devIcon + '</span>';
            const userTag = iconHtml + '<strong>' + escapeHtml(data.user) + ':</strong> ';
            const msgText = formatMessageText(data.text);
            const timeHtml = '<span class="msg-time">' + escapeHtml(data.time || '') + '</span>';
            div.innerHTML = userTag + msgText + timeHtml;
        }
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
        const rawMsg = msgInput.value;
        const trimmedMsg = rawMsg.trim();

        if (trimmedMsg.length === 0) return;

        const now = Date.now();
        if (now - lastSendTime < 1000) return;

        playClickSound();
        triggerVibration();
        lastSendTime = now;

        renderMessage({
            type: 'user',
            user: myUsername,
            device: myDeviceType,
            text: trimmedMsg,
            time: getClientTimestamp()
        });

        socket.emit('chat message', { text: trimmedMsg });
        msgInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    msgInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    };

    socket.on('chat message', (data) => {
        renderMessage(data);
        playMessageSound();
    });

    socket.on('user list update', (list) => {
        onlineCount.innerText = list.length;
        userListDiv.innerHTML = '';

        list.forEach((u) => {
            const item = document.createElement('div');
            item.className = 'user-item';

            const infoBox = document.createElement('div');
            infoBox.className = 'user-info-box';

            const iconSpan = document.createElement('span');
            iconSpan.innerText = getDeviceIcon(u.device);

            const nameSpan = document.createElement('span');
            nameSpan.innerText = u.name;

            infoBox.appendChild(iconSpan);
            infoBox.appendChild(nameSpan);
            item.appendChild(infoBox);

            if (u.name === myUsername) {
                const tag = document.createElement('span');
                tag.className = 'user-tag';
                tag.innerText = 'YOU';
                item.appendChild(tag);
            }

            item.onclick = () => {
                playClickSound();
                if (u.name !== myUsername) {
                    msgInput.value = '@' + u.name + ' ' + msgInput.value;
                    closeDrawer();
                    msgInput.focus();
                }
            };

            userListDiv.appendChild(item);
        });
    });

    function startPingLoop() {
        setInterval(() => {
            const start = Date.now();
            socket.emit('ping test', () => {
                const duration = Date.now() - start;
                pingInfo.innerText = 'PING: ' + duration + 'ms';
            });
        }, 5000);
    }
</script>
</body>
</html>
