<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatRoom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            direction: ltr;
        }
        body {
            background-color: #000;
            color: #fff;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
        }
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow: hidden;
            height: 100%;
            position: relative;
        }
        .hidden {
            display: none !important;
        }
        #login-screen {
            justify-content: center;
            align-items: center;
            gap: 16px;
        }
        .title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            outline: none;
            font-size: 16px;
            text-align: left;
            direction: ltr;
            user-select: text;
            -webkit-user-select: text;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #000;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .btn:active {
            background: #aaa;
        }
        .error {
            color: #ff3333;
            font-size: 14px;
            min-height: 18px;
            text-align: center;
        }
        .chat-header {
            padding: 14px;
            border-bottom: 1px solid #fff;
            font-weight: bold;
            text-align: center;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 10px 22px 10px;
            border: 1px solid #333;
            word-break: break-word;
            text-align: left;
            direction: ltr;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }
        .message a {
            color: #3b82f6;
            text-decoration: underline;
            word-break: break-all;
        }
        .msg-time {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 10px;
            color: #666;
        }
        .system-msg {
            font-size: 12px;
            padding: 4px 0;
            text-align: center;
            background: transparent;
            border: none;
            font-weight: bold;
            letter-spacing: 0.5px;
            white-space: pre-line;
        }
        .system-msg.join {
            color: #22c55e;
        }
        .system-msg.leave {
            color: #ef4444;
        }
        .system-msg.info {
            color: #3b82f6;
        }
        .input-area-wrapper {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #fff;
            flex-shrink: 0;
            width: 100%;
            padding-top: 8px;
        }
        .input-area {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .input-area input {
            flex: 1;
            width: 0;
        }
        .input-area .send-btn {
            width: auto;
            padding: 14px 20px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="login-screen" class="screen">
        <div class="title">CHAT</div>
        <input type="text" id="username" placeholder="Enter username..." maxlength="16" autocomplete="off" spellcheck="false">
        <div id="error" class="error"></div>
        <button class="btn" id="join-btn">JOIN</button>
    </div>

    <div id="chat-screen" class="screen hidden">
        <div class="chat-header">CHAT ROOM</div>
        <div id="messages"></div>

        <div class="input-area-wrapper">
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." maxlength="500" autocomplete="off" spellcheck="false">
                <button class="btn send-btn" id="send-btn">SEND</button>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myUsername = '';
    let lastSendTime = 0;

    function triggerVibration() {
        if (navigator.vibrate) {
            navigator.vibrate(25);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    function formatMessageText(text) {
        const escaped = escapeHtml(text);
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return escaped.replace(urlRegex, function(url) {
            return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
        });
    }

    function getClientTimestamp() {
        const d = new Date();
        const hrs = String(d.getHours()).padStart(2, '0');
        const mins = String(d.getMinutes()).padStart(2, '0');
        return hrs + ':' + mins;
    }

    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username');
    const joinBtn = document.getElementById('join-btn');
    const errorDiv = document.getElementById('error');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');

    function joinChat() {
        triggerVibration();
        const name = usernameInput.value.trim();
        const regex = /^[a-zA-Z]{3,16}$/;

        if (!regex.test(name)) {
            errorDiv.innerText = 'Invalid Name';
            return;
        }

        socket.emit('join', name, (res) => {
            if (res.success) {
                myUsername = name;
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                msgInput.focus();
            } else {
                errorDiv.innerText = res.error;
            }
        });
    }

    joinBtn.onclick = joinChat;
    usernameInput.onkeydown = (e) => {
        if (e.key === 'Enter') joinChat();
    };

    function renderMessage(data) {
        const div = document.createElement('div');

        if (data.type === 'system') {
            div.className = 'system-msg ' + data.event;
            div.innerText = data.text;
        } else {
            div.className = 'message';
            const userTag = '<strong>' + escapeHtml(data.user) + ':</strong> ';
            const msgText = formatMessageText(data.text);
            const timeHtml = '<span class="msg-time">' + escapeHtml(data.time || '') + '</span>';
            div.innerHTML = userTag + msgText + timeHtml;
        }
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
        const rawMsg = msgInput.value;
        const trimmedMsg = rawMsg.trim();

        if (trimmedMsg.length === 0) return;

        const now = Date.now();
        if (now - lastSendTime < 1000) return;

        triggerVibration();
        lastSendTime = now;

        renderMessage({
            type: 'user',
            user: myUsername,
            text: trimmedMsg,
            time: getClientTimestamp()
        });

        socket.emit('chat message', { text: trimmedMsg });
        msgInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    msgInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    };

    socket.on('chat message', (data) => {
        renderMessage(data);
    });
</script>
</body>
</html>
