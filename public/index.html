<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatRoom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            direction: ltr;
        }
        body {
            background-color: #000;
            color: #fff;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #desktop-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            color: #fff;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
        }
        .desktop-box {
            border: 1px solid #fff;
            padding: 24px;
            max-width: 400px;
        }
        .desktop-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .desktop-desc {
            font-size: 14px;
            color: #aaa;
            line-height: 1.5;
        }
        @media (min-width: 1025px) {
            #desktop-warning {
                display: flex;
            }
            .container {
                display: none !important;
            }
        }
        .container {
            width: 100%;
            max-width: 768px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
            position: relative;
        }
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow: hidden;
            height: 100%;
            position: relative;
        }
        .hidden {
            display: none !important;
        }
        #login-screen {
            justify-content: center;
            align-items: center;
            gap: 16px;
        }
        .title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            outline: none;
            font-size: 16px;
            text-align: left;
            direction: ltr;
            user-select: text;
            -webkit-user-select: text;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #000;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .btn:active {
            background: #aaa;
        }
        .error {
            color: #ff3333;
            font-size: 14px;
            min-height: 18px;
            text-align: center;
        }
        .chat-header {
            padding: 14px;
            border-bottom: 1px solid #fff;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        .online-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .online-btn:active {
            background: #fff;
            color: #000;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 10px 22px 10px;
            border: 1px solid #333;
            word-break: break-word;
            text-align: left;
            direction: ltr;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }
        .message a {
            color: #3b82f6;
            text-decoration: underline;
            word-break: break-all;
        }
        .msg-time {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 10px;
            color: #666;
        }
        .system-msg {
            font-size: 12px;
            padding: 4px 0;
            text-align: center;
            background: transparent;
            border: none;
            font-weight: bold;
            letter-spacing: 0.5px;
            white-space: pre-line;
        }
        .system-msg.join {
            color: #22c55e;
        }
        .system-msg.leave {
            color: #ef4444;
        }
        .system-msg.info {
            color: #3b82f6;
        }
        .input-area-wrapper {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #fff;
            flex-shrink: 0;
            width: 100%;
            padding-top: 8px;
        }
        .input-area {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .input-area input {
            flex: 1;
            width: 0;
        }
        .input-area .send-btn {
            width: auto;
            padding: 14px 20px;
            white-space: nowrap;
        }
        .drawer-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10;
        }
        .drawer {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            height: 100%;
            background: #000;
            border-left: 1px solid #fff;
            z-index: 20;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        .drawer.open {
            transform: translateX(0);
        }
        @keyframes peekAnimation {
            0% { transform: translateX(100%); }
            40% { transform: translateX(calc(100% - 35px)); }
            70% { transform: translateX(calc(100% - 35px)); }
            100% { transform: translateX(100%); }
        }
        .drawer.peek {
            animation: peekAnimation 0.8s ease-in-out;
        }
        .drawer-header {
            padding: 14px;
            border-bottom: 1px solid #fff;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .drawer-close-btn {
            background: none;
            border: none;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
        }
        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .user-item {
            padding: 10px;
            border: 1px solid #222;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-item:active {
            border-color: #fff;
        }
        .user-tag {
            font-size: 10px;
            color: #666;
            border: 1px solid #333;
            padding: 2px 4px;
        }
        .drawer-footer {
            padding: 12px;
            border-top: 1px solid #222;
            font-size: 11px;
            color: #666;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div id="desktop-warning">
    <div class="desktop-box">
        <div class="desktop-title">[ ACCESS RESTRICTED ]</div>
        <div class="desktop-desc">THIS APPLICATION IS DESIGNED FOR MOBILE AND TABLET DEVICES ONLY. PLEASE OPEN FROM A MOBILE DEVICE.</div>
    </div>
</div>

<div class="container">
    <div id="login-screen" class="screen">
        <div class="title">CHAT</div>
        <input type="text" id="username" placeholder="Enter username..." maxlength="16" autocomplete="off" spellcheck="false">
        <div id="error" class="error"></div>
        <button class="btn" id="join-btn">JOIN</button>
    </div>

    <div id="chat-screen" class="screen hidden">
        <div class="chat-header">
            <span>CHAT ROOM</span>
            <button id="online-btn" class="online-btn">[ ONLINE: 0 ]</button>
        </div>
        <div id="messages"></div>

        <div class="input-area-wrapper">
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." maxlength="500" autocomplete="off" spellcheck="false">
                <button class="btn send-btn" id="send-btn">SEND</button>
            </div>
        </div>
    </div>

    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-header">
            <span>USERS</span>
            <button id="close-drawer-btn" class="drawer-close-btn">[X]</button>
        </div>
        <div id="user-list" class="user-list"></div>
        <div class="drawer-footer" id="ping-info">PING: --ms</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myUsername = '';
    let lastSendTime = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    function triggerVibration() {
        if (navigator.vibrate) {
            navigator.vibrate(25);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    function formatMessageText(text) {
        const escaped = escapeHtml(text);
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return escaped.replace(urlRegex, function(url) {
            return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
        });
    }

    function getClientTimestamp() {
        const d = new Date();
        const hrs = String(d.getHours()).padStart(2, '0');
        const mins = String(d.getMinutes()).padStart(2, '0');
        return hrs + ':' + mins;
    }

    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username');
    const joinBtn = document.getElementById('join-btn');
    const errorDiv = document.getElementById('error');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const drawer = document.getElementById('drawer');
    const drawerBackdrop = document.getElementById('drawer-backdrop');
    const onlineBtn = document.getElementById('online-btn');
    const closeDrawerBtn = document.getElementById('close-drawer-btn');
    const userListDiv = document.getElementById('user-list');
    const pingInfo = document.getElementById('ping-info');

    function openDrawer() {
        drawer.classList.remove('peek');
        drawer.classList.add('open');
        drawerBackdrop.classList.remove('hidden');
    }

    function closeDrawer() {
        drawer.classList.remove('open');
        drawerBackdrop.classList.add('hidden');
    }

    onlineBtn.onclick = () => {
        triggerVibration();
        openDrawer();
    };

    closeDrawerBtn.onclick = () => {
        triggerVibration();
        closeDrawer();
    };

    drawerBackdrop.onclick = () => {
        closeDrawer();
    };

    document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    }, false);

    function handleSwipe() {
        const diff = touchEndX - touchStartX;
        if (diff < -60) {
            openDrawer();
        } else if (diff > 60) {
            closeDrawer();
        }
    }

    function joinChat() {
        triggerVibration();
        const name = usernameInput.value.trim();
        const regex = /^[a-zA-Z]{3,16}$/;

        if (!regex.test(name)) {
            errorDiv.innerText = 'Invalid Name';
            return;
        }

        socket.emit('join', name, (res) => {
            if (res.success) {
                myUsername = name;
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                msgInput.focus();

                setTimeout(() => {
                    drawer.classList.add('peek');
                }, 500);

                startPingLoop();
            } else {
                errorDiv.innerText = res.error;
            }
        });
    }

    joinBtn.onclick = joinChat;
    usernameInput.onkeydown = (e) => {
        if (e.key === 'Enter') joinChat();
    };

    function renderMessage(data) {
        const div = document.createElement('div');

        if (data.type === 'system') {
            div.className = 'system-msg ' + data.event;
            div.innerText = data.text;
        } else {
            div.className = 'message';
            const userTag = '<strong>' + escapeHtml(data.user) + ':</strong> ';
            const msgText = formatMessageText(data.text);
            const timeHtml = '<span class="msg-time">' + escapeHtml(data.time || '') + '</span>';
            div.innerHTML = userTag + msgText + timeHtml;
        }
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
        const rawMsg = msgInput.value;
        const trimmedMsg = rawMsg.trim();

        if (trimmedMsg.length === 0) return;

        const now = Date.now();
        if (now - lastSendTime < 1000) return;

        triggerVibration();
        lastSendTime = now;

        renderMessage({
            type: 'user',
            user: myUsername,
            text: trimmedMsg,
            time: getClientTimestamp()
        });

        socket.emit('chat message', { text: trimmedMsg });
        msgInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    msgInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    };

    socket.on('chat message', (data) => {
        renderMessage(data);
    });

    socket.on('user list update', (list) => {
        onlineBtn.innerText = '[ ONLINE: ' + list.length + ' ]';
        userListDiv.innerHTML = '';

        list.forEach((u) => {
            const item = document.createElement('div');
            item.className = 'user-item';

            const nameSpan = document.createElement('span');
            nameSpan.innerText = u;

            item.appendChild(nameSpan);

            if (u === myUsername) {
                const tag = document.createElement('span');
                tag.className = 'user-tag';
                tag.innerText = 'YOU';
                item.appendChild(tag);
            }

            item.onclick = () => {
                if (u !== myUsername) {
                    msgInput.value = '@' + u + ' ' + msgInput.value;
                    closeDrawer();
                    msgInput.focus();
                }
            };

            userListDiv.appendChild(item);
        });
    });

    function startPingLoop() {
        setInterval(() => {
            const start = Date.now();
            socket.emit('ping test', () => {
                const duration = Date.now() - start;
                pingInfo.innerText = 'PING: ' + duration + 'ms';
            });
        }, 5000);
    }
</script>
</body>
</html>
